<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="40" y="110" width="170" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="125.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Browser</text>
<text x="125.0" y="160.0" font-size="11.5" fill="#555555" text-anchor="middle">on your host</text>
<rect x="330" y="105" width="200" height="85" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
