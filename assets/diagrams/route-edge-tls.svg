<path d="M210,145 L330,145" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="276.0" y="139.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">HTTPS</text>
<text x="276.0" y="139.0" font-size="11" fill="#b8650a" text-anchor="middle">HTTPS</text>
<path d="M530,145 L660,145" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="601.0" y="139.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">HTTP (plain)</text>
