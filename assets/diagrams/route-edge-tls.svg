<text x="440" y="45" font-size="11" fill="#888" text-anchor="middle" font-weight="700">edge TLS: encrypted to the router, plain HTTP to the Pod</text>
<text x="440" y="230" font-size="13" fill="#64748b" text-anchor="middle">trust the cluster ingress CA (curl --cacert), never --insecure</text>
