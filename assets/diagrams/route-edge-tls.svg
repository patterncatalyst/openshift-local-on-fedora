<rect x="660" y="110" width="180" height="70" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="750.0" y="143.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Pod</text>
