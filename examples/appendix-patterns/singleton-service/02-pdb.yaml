# Protects shipping-service's one replica from voluntary disruption: the
# Eviction API (node drain, the descheduler, an autoscaler scaling a node down)
# must leave at least 1 Pod available, which for a single-replica Deployment
# means it must leave the only Pod alone. maxUnavailable: 0 would express the
# same; minAvailable reads more directly as "this one Pod must survive."
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shipping-service-pdb
  namespace: patterns
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-service
