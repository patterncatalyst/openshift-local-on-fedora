# notification-service with an init container that runs its Alembic migration
# before the main container starts, under restricted-v2. Same image for both:
# the migration (alembic upgrade head) and the app (uvicorn) ship in one
# artifact, so the schema the migration applies always matches the models the
# app runs. The main container only starts if the init container exits zero.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: migrate
          image: image-registry.openshift-image-registry.svc:5000/patterns/notification-service:v1
          imagePullPolicy: IfNotPresent
          workingDir: /opt/app-root/src
          command: ["alembic", "upgrade", "head"]
          env:
            - name: SERVICE_SCHEMA
              value: notifications
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: username }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: password }
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: dbname }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notification-service
          image: image-registry.openshift-image-registry.svc:5000/patterns/notification-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              value: notifications
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_PORT
              value: "5432"
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: username }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: password }
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: dbname }
            - name: KAFKA_BOOTSTRAP
              value: "kafka.invalid:9092"
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - port: 80
      targetPort: 8080
