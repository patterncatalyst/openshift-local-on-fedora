      labels:
        app.kubernetes.io/name: intolerant-placeholder
    spec:
      securityContext:
        runAsNonRoot: true
      nodeSelector:
        zone: warehouse-a
      containers:
        - name: placeholder
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["sleep", "infinity"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
