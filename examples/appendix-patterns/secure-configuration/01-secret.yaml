# inventory-service's own Postgres credentials, in a distinctly named Secret
# rather than reusing the shared patterns-postgres-app. Written with stringData
# (plain text at creation; the API server base64-encodes it into data), so the
# manifest is reviewable by eye. This Postgres only recognizes one role, so the
# values match the shared Secret here; the point the pattern demonstrates is one
# service owning one named Secret, so it can be rotated or revoked without
# touching every other service.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-credentials
  namespace: patterns
type: Opaque
stringData:
  username: patterns_app
  password: changeme
  dbname: patterns
