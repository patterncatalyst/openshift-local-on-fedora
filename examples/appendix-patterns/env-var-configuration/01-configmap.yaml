# Non-secret, environment-shaped values for notification-service's Kafka
# consumer and the Apicurio schema registry it decodes against. These belong in
# a ConfigMap rather than literals baked into the Deployment because ops might
# change a bootstrap address or topic name per environment without a new image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: patterns
data:
  kafka_bootstrap: "kafka.invalid:9092"
  kafka_order_topic: "order-placed"
  kafka_group: "notification-service"
  apicurio_url: "http://apicurio.invalid:8080"
