# Defaults and bounds each container. default/defaultRequest are the mutating
# half (stamped onto a container that omits them, before quota validation runs);
# min/max are the validating half (a container outside the band is rejected).
apiVersion: v1
kind: LimitRange
metadata:
  name: patterns-limits
  namespace: patterns
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 128Mi }
      default: { cpu: 200m, memory: 256Mi }
      min: { cpu: 25m, memory: 64Mi }
      max: { cpu: 500m, memory: 512Mi }
