# A ClusterRole bound by a namespaced RoleBinding: the built-in OpenShift
# "view" ClusterRole (cluster-scoped, read-only on most namespaced resources)
# granted only within patterns. The same ClusterRole bound with a
# ClusterRoleBinding would apply cluster-wide; a RoleBinding confines it to one
# namespace. This is the standard way to reuse a well-tested rule set per
# namespace without granting it everywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-readonly
  namespace: patterns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-readonly-binding
  namespace: patterns
subjects:
  - kind: ServiceAccount
    name: ops-readonly
    namespace: patterns
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
