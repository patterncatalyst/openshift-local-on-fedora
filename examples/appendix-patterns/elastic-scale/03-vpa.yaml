# VerticalPodAutoscaler, Recommendation-only (updateMode: "Off"): VPA watches
# shipping-service's actual CPU/memory usage and computes a recommended
# request/limit, but never evicts a Pod or rewrites the Deployment in this
# mode. That matters alongside the HPA: running VPA in "Auto" mode on the same
# resource (CPU) an HPA is already scaling on is the one combination the two
# autoscalers can't safely share, since VPA changing the per-Pod CPU request
# would also change what HPA's utilization percentage is measured against, out
# from under it. "Off" mode only recommends; a human (or a later, separate
# change) decides whether to act.
#
# On OpenShift the VPA components come from the VerticalPodAutoscaler operator
# (OperatorHub), not a built-in. See README.md for the one-time install.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: shipping-service
  namespace: patterns
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping-service
  updatePolicy:
    updateMode: "Off"
