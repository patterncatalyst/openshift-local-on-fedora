# graphql-gateway, starting at replicas: 0. The ScaledObject in
# 05-gateway-scaledobject.yaml takes ownership of this count the moment it's
# applied: KEDA generates an HPA behind the scenes wired to its own trigger,
# and that HPA (not a human, not this Deployment's own spec) decides when zero
# stops being the right number. restricted-v2 clean.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: patterns
  labels:
    app.kubernetes.io/name: graphql-gateway
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: graphql-gateway
          image: image-registry.openshift-image-registry.svc:5000/patterns/graphql-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # This chapter only brings the gateway up and down on a schedule,
          # never runs a real GraphQL query, so ORDER_REST_URL and
          # INVENTORY_GRPC_ADDR are left at their defaults.
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - port: 80
      targetPort: 8080
