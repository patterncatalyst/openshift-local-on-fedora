# inventory-service: a gRPC server on 50051 plus an HTTP health endpoint on
# 8080. graphql-gateway calls it over gRPC; this chapter's allow rule opens
# exactly that one port to exactly that one caller. restricted-v2 clean.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: inventory-service
          image: image-registry.openshift-image-registry.svc:5000/patterns/inventory-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              value: inventory
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: username }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: password }
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: dbname }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: inventory-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
    - name: http
      port: 8080
      targetPort: 8080
