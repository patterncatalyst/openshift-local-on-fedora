# graphql-gateway: the one legitimate caller of inventory-service's gRPC port.
# The allow rule in 05 names this workload's label specifically. restricted-v2 clean.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-gateway
  namespace: patterns
  labels:
    app.kubernetes.io/name: graphql-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-gateway
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: graphql-gateway
          image: image-registry.openshift-image-registry.svc:5000/patterns/graphql-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: graphql-gateway
  namespace: patterns
spec:
  selector:
    app.kubernetes.io/name: graphql-gateway
  ports:
    - port: 80
      targetPort: 8080
