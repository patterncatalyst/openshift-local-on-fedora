# shipping-service plus a trivial second container, heartbeat, that does nothing
# related to shipping: it exists only so `oc logs -c` and `oc exec -c` have a
# real second container to pick between. restricted-v2 clean.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  namespace: patterns
  labels:
    app.kubernetes.io/name: shipping-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-service
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: shipping-service
          image: image-registry.openshift-image-registry.svc:5000/patterns/shipping-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_SCHEMA
              value: shipping
            - name: PG_HOST
              value: patterns-postgres.patterns.svc.cluster.local
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: username }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: password }
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef: { name: patterns-postgres-app, key: dbname }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
        - name: heartbeat
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c", "while true; do echo heartbeat $(date -u +%H:%M:%S); sleep 10; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
